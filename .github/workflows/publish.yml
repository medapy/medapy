name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/medapy
    permissions:
      id-token: write  # trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # setuptools-scm needs tags to derive the version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import importlib.metadata as m, medapy; print(m.version('medapy'))"
      - name: Publish to PyPI
        run: uv publish
