[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "medapy"
dynamic = ["version"]
description = "A Python package to work with measured data"
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2,<4",
  "pint>=0.24",
  "pint-pandas>=0.7",
]
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"

[project.optional-dependencies]
fit = [
  "scipy>=1.15",
  "numdifftools>=0.9",
  "lmfit>=1.3"
]
plot = [
  "matplotlib>=3.10",
]
all = ["medapy[fit, plot]"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.7",
  "mkdocstrings[python]>=1.0",
  "pymdown-extensions>=10.20",
]

[tool.setuptools_scm]

[tool.uv]
# Rebuild the editable install when the git version changes (setuptools-scm)
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/medapy/medapy"
Documentation = "https://medapy.github.io/medapy/"
Repository = "https://github.com/medapy/medapy"
Issues = "https://github.com/medapy/medapy/issues"

