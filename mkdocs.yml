site_name: MeDaPy Docs
site_url: https://medapy.github.io/medapy/
repo_url: https://github.com/medapy/medapy
repo_name: medapy/medapy
edit_uri: edit/master/docs/
strict: true
# Build-time helpers, not pages
exclude_docs: |
  /ext/

theme:
  name: "material"
  features:
    - navigation.indexes

plugins:
  # Explicit, so Markdown anchors ([](){#id}) are registered as cross-ref targets
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - docs/ext/see_also.py:SeeAlsoLinks
            # Most docstrings are NumPy style, some Google style; detect per docstring
            docstring_style: auto
            docstring_options:
              default: numpy
              style_order: [numpy, google]
            filters: ["!^_"]
            members_order: source
            heading_level: 2
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - admonition
  - attr_list
  - pymdownx.details

nav:
  - Home: index.md
  - Tutorials: tutorials.md
  - How-to guides:
      - how-to/index.md
      - Organize data files: how-to/files.md
      - Measurement sheets: how-to/sheets.md
      - Process data: how-to/processing.md
      - Fit data: how-to/fitting.md
  - Explanation: explanation.md
  - Reference:
      - reference/index.md
      - Measurement sheet: reference/ms.md
      - Processing: reference/processing.md
      - Electron transport: reference/transport.md
      - Collections: reference/collection.md
      - Utilities: reference/utilities.md
